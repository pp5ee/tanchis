<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            padding: 20px;
        }

        canvas {
            background: #0f0f1a;
            border: 2px solid #2a2a4a;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 212, 170, 0.1);
            display: block;
            will-change: transform;
            max-width: 100%;
            max-height: calc(100vh - 200px);
            width: auto;
            height: auto;
        }

        .mobile-controls {
            display: none;
            margin-top: 16px;
            gap: 8px;
            flex-direction: column;
            align-items: center;
        }

        .mobile-controls-row {
            display: flex;
            gap: 8px;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 212, 170, 0.1);
            border: 2px solid rgba(0, 212, 170, 0.3);
            border-radius: 12px;
            color: #00ffc8;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background 0.15s, transform 0.1s;
        }

        .mobile-btn:active {
            background: rgba(0, 212, 170, 0.3);
            transform: scale(0.95);
        }

        @media (max-width: 640px) {
            .game-container {
                padding: 10px;
                width: 100%;
            }

            .score-container {
                gap: 16px;
            }

            .score-display, .high-score-display {
                font-size: 20px;
            }

            .controls-hint {
                display: none;
            }

            .mobile-controls {
                display: flex;
            }

            .overlay-title {
                font-size: 36px;
            }

            .overlay-score {
                font-size: 18px;
            }

            .overlay-hint {
                font-size: 14px;
            }
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 26, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            z-index: 10;
        }

        .game-overlay.hidden {
            display: none;
        }

        .overlay-title {
            color: #00ffc8;
            font-size: 48px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
            margin-bottom: 16px;
        }

        .overlay-score {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .overlay-score .value {
            color: #00ffc8;
            font-weight: 700;
        }

        .overlay-hint {
            color: #6a6a8a;
            font-size: 16px;
            margin-top: 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .score-container {
            display: flex;
            gap: 32px;
            margin-bottom: 16px;
        }

        .score-display, .high-score-display {
            color: #00ffc8;
            font-family: monospace;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        }

        .score-label {
            color: #6a6a8a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .controls-hint {
            color: #6a6a8a;
            font-size: 14px;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-container">
            <div>
                <div class="score-label">Score</div>
                <div class="score-display" id="score">0</div>
            </div>
            <div>
                <div class="score-label">High Score</div>
                <div class="high-score-display" id="highScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="game-overlay" id="startOverlay">
            <div class="overlay-title">SNAKE</div>
            <div class="overlay-hint">Press SPACE or Click to Start</div>
        </div>
        <div class="game-overlay hidden" id="gameOverOverlay">
            <div class="overlay-title">GAME OVER</div>
            <div class="overlay-score">Score: <span class="value" id="finalScore">0</span></div>
            <div class="overlay-score">Best: <span class="value" id="finalHighScore">0</span></div>
            <div class="overlay-hint">Press SPACE or Click to Restart</div>
        </div>
        <div class="game-overlay hidden" id="pauseOverlay">
            <div class="overlay-title">PAUSED</div>
            <div class="overlay-hint">Press P to Resume</div>
        </div>
        <div class="controls-hint">Use Arrow Keys or WASD to move · P to Pause</div>
        <div class="mobile-controls" id="mobileControls">
            <div class="mobile-controls-row">
                <button class="mobile-btn" data-direction="up">↑</button>
            </div>
            <div class="mobile-controls-row">
                <button class="mobile-btn" data-direction="left">←</button>
                <button class="mobile-btn" data-direction="down">↓</button>
                <button class="mobile-btn" data-direction="right">→</button>
            </div>
        </div>
    </div>

    <script>
        class SnakeGame {
            // Class constants for configuration
            static CELL_SIZE = 30;
            static GRID_SIZE = 20;
            static BASE_CANVAS_SIZE = 600;
            static TICK_INTERVAL = 100;
            static SNAKE_COLOR = '#00d4aa';
            static FOOD_COLOR = '#ff4757';
            static GRID_COLOR = '#1a1a3a';
            static BG_COLOR = '#0f0f1a';

            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.scoreElement = document.getElementById('score');

                // Grid configuration (from constants)
                this.cellSize = SnakeGame.CELL_SIZE;
                this.gridSize = SnakeGame.GRID_SIZE;
                this.baseCanvasSize = SnakeGame.BASE_CANVAS_SIZE;

                // Game state
                this.snake = [];
                this.food = null;
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.score = 0;
                this.gameRunning = false;
                this.gameLoopId = null;
                this.lastTick = 0;
                this.tickInterval = SnakeGame.TICK_INTERVAL;

                // Visual effects
                this.foodPulsePhase = 0;
                this.particles = [];

                // High score
                this.highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;

                this.scaleCanvas();

                // Overlays
                this.startOverlay = document.getElementById('startOverlay');
                this.gameOverOverlay = document.getElementById('gameOverOverlay');
                this.pauseOverlay = document.getElementById('pauseOverlay');
                this.highScoreElement = document.getElementById('highScore');
                this.finalScoreElement = document.getElementById('finalScore');
                this.finalHighScoreElement = document.getElementById('finalHighScore');

                this.updateHighScore();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupResizeHandler();
                this.reset();
                this.showStartScreen();
            }

            showStartScreen() {
                this.gameRunning = false;
                this.startOverlay.classList.remove('hidden');
                this.gameOverOverlay.classList.add('hidden');
                this.pauseOverlay.classList.add('hidden');
                this.draw();
            }

            start() {
                this.startOverlay.classList.add('hidden');
                this.gameOverOverlay.classList.add('hidden');
                this.pauseOverlay.classList.add('hidden');
                this.gameRunning = true;
                this.gameLoop();
            }

            togglePause() {
                if (!this.gameRunning && !this.pauseOverlay.classList.contains('hidden')) {
                    this.start();
                } else if (this.gameRunning) {
                    this.gameRunning = false;
                    this.pauseOverlay.classList.remove('hidden');
                }
            }

            reset() {
                // Start snake in center
                const startX = Math.floor(this.gridSize / 2);
                const startY = Math.floor(this.gridSize / 2);
                this.snake = [
                    { x: startX, y: startY },
                    { x: startX - 1, y: startY },
                    { x: startX - 2, y: startY }
                ];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.score = 0;
                this.particles = [];
                this.updateScore();
                this.updateHighScore();
                this.spawnFood();
            }

            setupResizeHandler() {
                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        this.scaleCanvas();
                        this.draw();
                    }, 100);
                });
            }

            scaleCanvas() {
                const container = this.canvas.parentElement;
                const maxWidth = Math.min(window.innerWidth - 20, 600);
                const maxHeight = window.innerHeight - 200;
                const size = Math.min(maxWidth, maxHeight, 600);

                // Set display size (CSS pixels)
                this.canvas.style.width = size + 'px';
                this.canvas.style.height = size + 'px';

                // Set actual canvas size (handle high-DPI)
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.baseCanvasSize * dpr;
                this.canvas.height = this.baseCanvasSize * dpr;

                // Scale context for high-DPI
                this.ctx.scale(dpr, dpr);

                // Store display scale factor for coordinate calculations
                this.displayScale = size / this.baseCanvasSize;
            }
            setupEventListeners() {
                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (e.key === ' ' || e.key === 'Spacebar') {
                        e.preventDefault();
                        if (!this.gameRunning && this.pauseOverlay.classList.contains('hidden')) {
                            this.reset();
                            this.start();
                        }
                    } else if (e.key === 'p' || e.key === 'P') {
                        e.preventDefault();
                        this.togglePause();
                    } else {
                        this.handleInput(e.key);
                    }
                });

                this.canvas.addEventListener('click', () => {
                    if (!this.gameRunning && this.pauseOverlay.classList.contains('hidden')) {
                        this.reset();
                        this.start();
                    }
                });

                // Touch / swipe controls
                let touchStartX = 0;
                let touchStartY = 0;
                let touchStartTime = 0;

                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    touchStartTime = Date.now();
                }, { passive: false });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const touch = e.changedTouches[0];
                    const dx = touch.clientX - touchStartX;
                    const dy = touch.clientY - touchStartY;
                    const dt = Date.now() - touchStartTime;

                    // Minimum swipe distance and maximum time
                    const minSwipeDistance = 30;
                    const maxSwipeTime = 500;

                    if (dt < maxSwipeTime && (Math.abs(dx) > minSwipeDistance || Math.abs(dy) > minSwipeDistance)) {
                        if (Math.abs(dx) > Math.abs(dy)) {
                            // Horizontal swipe
                            this.handleInput(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
                        } else {
                            // Vertical swipe
                            this.handleInput(dy > 0 ? 'ArrowDown' : 'ArrowUp');
                        }
                    } else if (dt < 200 && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
                        // Tap to start/restart
                        if (!this.gameRunning && this.pauseOverlay.classList.contains('hidden')) {
                            this.reset();
                            this.start();
                        }
                    }
                }, { passive: false });

                // Prevent scrolling on touch
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                }, { passive: false });

                // Mobile button controls
                const mobileButtons = document.querySelectorAll('.mobile-btn');
                mobileButtons.forEach(btn => {
                    const direction = btn.dataset.direction;
                    const keyMap = {
                        'up': 'ArrowUp',
                        'down': 'ArrowDown',
                        'left': 'ArrowLeft',
                        'right': 'ArrowRight'
                    };

                    const handleBtnPress = (e) => {
                        e.preventDefault();
                        this.handleInput(keyMap[direction]);
                    };

                    btn.addEventListener('touchstart', handleBtnPress, { passive: false });
                    btn.addEventListener('mousedown', handleBtnPress);
                });

                // Prevent double-tap zoom on mobile
                document.addEventListener('touchstart', (e) => {
                    if (e.touches.length > 1) {
                        e.preventDefault();
                    }
                }, { passive: false });

                let lastTouchEnd = 0;
                document.addEventListener('touchend', (e) => {
                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) {
                        e.preventDefault();
                    }
                    lastTouchEnd = now;
                }, { passive: false });
            }

            handleInput(key) {
                const keyMap = {
                    'ArrowUp': { x: 0, y: -1 },
                    'ArrowDown': { x: 0, y: 1 },
                    'ArrowLeft': { x: -1, y: 0 },
                    'ArrowRight': { x: 1, y: 0 },
                    'w': { x: 0, y: -1 },
                    'W': { x: 0, y: -1 },
                    's': { x: 0, y: 1 },
                    'S': { x: 0, y: 1 },
                    'a': { x: -1, y: 0 },
                    'A': { x: -1, y: 0 },
                    'd': { x: 1, y: 0 },
                    'D': { x: 1, y: 0 }
                };

                const newDirection = keyMap[key];
                if (!newDirection) return;

                // Prevent 180-degree turns
                if (this.direction.x + newDirection.x !== 0 ||
                    this.direction.y + newDirection.y !== 0) {
                    this.nextDirection = newDirection;
                }
            }

            spawnFood() {
                let foodPosition;
                let validPosition = false;

                while (!validPosition) {
                    foodPosition = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };

                    // Check if food spawns on snake
                    validPosition = !this.snake.some(
                        segment => segment.x === foodPosition.x && segment.y === foodPosition.y
                    );
                }

                this.food = foodPosition;
            }

            update() {
                // Update direction
                this.direction = { ...this.nextDirection };

                // Calculate new head position
                const head = { ...this.snake[0] };
                head.x += this.direction.x;
                head.y += this.direction.y;

                // Check wall collision
                if (head.x < 0 || head.x >= this.gridSize ||
                    head.y < 0 || head.y >= this.gridSize) {
                    this.gameOver();
                    return;
                }

                // Check self collision
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.gameOver();
                    return;
                }

                // Add new head
                this.snake.unshift(head);

                // Check food collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.updateScore();
                    this.createParticles(this.food.x, this.food.y);
                    this.spawnFood();
                } else {
                    // Remove tail if no food eaten
                    this.snake.pop();
                }
            }

            updateScore() {
                this.scoreElement.textContent = this.score;
            }

            updateHighScore() {
                this.highScoreElement.textContent = this.highScore;
            }

            createParticles(x, y) {
                const centerX = x * this.cellSize + this.cellSize / 2;
                const centerY = y * this.cellSize + this.cellSize / 2;
                const colors = ['#00ffc8', '#00d4aa', '#ff4757', '#ffa502'];

                for (let i = 0; i < 12; i++) {
                    const angle = (Math.PI * 2 / 12) * i;
                    const speed = 2 + Math.random() * 3;
                    this.particles.push({
                        x: centerX,
                        y: centerY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1.0,
                        decay: 0.03 + Math.random() * 0.02,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: 3 + Math.random() * 4
                    });
                }
            }

            gameOver() {
                this.gameRunning = false;
                cancelAnimationFrame(this.gameLoopId);

                // Update high score
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('snakeHighScore', this.highScore);
                }

                // Show game over overlay
                this.finalScoreElement.textContent = this.score;
                this.finalHighScoreElement.textContent = this.highScore;
                this.gameOverOverlay.classList.remove('hidden');
            }

            draw() {
                this.drawBackground();
                this.drawGrid();
                this.updateAndDrawFood();
                this.drawParticles();
                this.drawSnake();
            }

            drawBackground() {
                // Use baseCanvasSize, not canvas.width/height (which are DPR-scaled)
                this.ctx.fillStyle = SnakeGame.BG_COLOR;
                this.ctx.fillRect(0, 0, this.baseCanvasSize, this.baseCanvasSize);
            }

            drawGrid() {
                this.ctx.strokeStyle = 'rgba(26, 26, 58, 0.5)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i <= this.gridSize; i++) {
                    const pos = i * this.cellSize;
                    this.ctx.beginPath();
                    this.ctx.moveTo(pos, 0);
                    this.ctx.lineTo(pos, this.baseCanvasSize);
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, pos);
                    this.ctx.lineTo(this.baseCanvasSize, pos);
                    this.ctx.stroke();
                }
            }

            updateAndDrawFood() {
                this.foodPulsePhase += 0.1;

                if (!this.food) return;

                const centerX = this.food.x * this.cellSize + this.cellSize / 2;
                const centerY = this.food.y * this.cellSize + this.cellSize / 2;
                const pulseRadius = Math.sin(this.foodPulsePhase) * 3;

                // Outer glow
                const gradient = this.ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, this.cellSize / 2 + 8 + pulseRadius
                );
                gradient.addColorStop(0, 'rgba(255, 71, 87, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 71, 87, 0.3)');
                gradient.addColorStop(1, 'rgba(255, 71, 87, 0)');

                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, this.cellSize / 2 + 10 + pulseRadius, 0, Math.PI * 2);
                this.ctx.fill();

                // Core orb
                this.ctx.fillStyle = SnakeGame.FOOD_COLOR;
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, this.cellSize / 2 - 4, 0, Math.PI * 2);
                this.ctx.fill();

                // Highlight
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                this.ctx.beginPath();
                this.ctx.arc(centerX - 4, centerY - 4, 4, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawParticles() {
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    p.size *= 0.95;

                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.life;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;
                });
            }

            drawSnake() {
                this.snake.forEach((segment, index) => {
                    const x = segment.x * this.cellSize + 2;
                    const y = segment.y * this.cellSize + 2;
                    const size = this.cellSize - 4;

                    const gradient = this.ctx.createLinearGradient(x, y, x + size, y + size);
                    if (index === 0) {
                        // Head - brighter gradient
                        gradient.addColorStop(0, '#00ffc8');
                        gradient.addColorStop(1, '#00d4aa');
                    } else {
                        // Body - standard gradient
                        gradient.addColorStop(0, '#00d4aa');
                        gradient.addColorStop(1, '#00a884');
                    }

                    this.ctx.fillStyle = gradient;
                    SnakeGame.roundRect(this.ctx, x, y, size, size, index === 0 ? 6 : 4);
                    this.ctx.fill();

                    // Draw eyes on head
                    if (index === 0) {
                        this.drawSnakeEyes(x, y, size);
                    }
                });
            }

            drawSnakeEyes(x, y, size) {
                this.ctx.fillStyle = SnakeGame.BG_COLOR;
                const eyeSize = 3;
                const eyeOffset = 6;

                if (this.direction.x === 1) {
                    this.ctx.beginPath();
                    this.ctx.arc(x + size - eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.arc(x + size - eyeOffset, y + size - eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.fill();
                } else if (this.direction.x === -1) {
                    this.ctx.beginPath();
                    this.ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.arc(x + eyeOffset, y + size - eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.fill();
                } else if (this.direction.y === -1) {
                    this.ctx.beginPath();
                    this.ctx.arc(x + eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.arc(x + size - eyeOffset, y + eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.fill();
                } else {
                    this.ctx.beginPath();
                    this.ctx.arc(x + eyeOffset, y + size - eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.arc(x + size - eyeOffset, y + size - eyeOffset, eyeSize, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            static roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }

            gameLoop(timestamp) {
                if (!this.gameRunning) return;

                this.gameLoopId = requestAnimationFrame((ts) => this.gameLoop(ts));

                if (timestamp - this.lastTick >= this.tickInterval) {
                    this.update();
                    this.lastTick = timestamp;
                }

                this.draw();
            }
        }

        // Start the game
        new SnakeGame();
    </script>
</body>
</html>
